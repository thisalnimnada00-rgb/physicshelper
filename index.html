<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Physics Circuit Solver</title>

<style>
body{
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff9a00,#ff3d00);
color:white;
}

h1{
margin-top:20px;
}

#toolbar{
margin:20px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

canvas{
background:white;
border:3px solid black;
}

input{
padding:8px;
margin:5px;
}

#result{
font-size:20px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>⚡ Physics Circuit Solver</h1>

<div id="toolbar">

<select id="systemType">
<option value="resistor">Resistors</option>
<option value="capacitor">Capacitors</option>
</select>

<select id="connectionType">
<option value="series">Series</option>
<option value="parallel">Parallel</option>
</select>

<button onclick="addComponent()">Add Component</button>
<button onclick="calculate()">Calculate Equivalent</button>

</div>

<canvas id="circuitCanvas" width="800" height="400"></canvas>

<div id="values"></div>

<div id="result"></div>

<script>

let components=[]
let canvas=document.getElementById("circuitCanvas")
let ctx=canvas.getContext("2d")

function addComponent(){

let value=prompt("Enter resistance (Ohms)")

if(value==null)return

components.push(Number(value))

drawCircuit()

displayInputs()

}

function drawCircuit(){

ctx.clearRect(0,0,canvas.width,canvas.height)

let x=50
let y=200

for(let i=0;i<components.length;i++){

drawResistor(x,y)

ctx.fillStyle="black"
ctx.fillText(components[i]+"Ω",x+10,y-20)

x+=120

}

}

function drawResistor(x,y){

ctx.beginPath()

ctx.moveTo(x,y)

ctx.lineTo(x+10,y)

ctx.lineTo(x+20,y-10)

ctx.lineTo(x+30,y+10)

ctx.lineTo(x+40,y-10)

ctx.lineTo(x+50,y+10)

ctx.lineTo(x+60,y)

ctx.lineTo(x+70,y)

ctx.stroke()

}

function displayInputs(){

let html=""

for(let i=0;i<components.length;i++){

html+=`
<input type="number" value="${components[i]}" 
onchange="components[${i}]=Number(this.value)">
`

}

document.getElementById("values").innerHTML=html

}

function calculate(){

let type=document.getElementById("connectionType").value
let system=document.getElementById("systemType").value

if(system==="resistor"){

if(type==="series"){

let R=0

components.forEach(v=>R+=v)

document.getElementById("result").innerText=
"Equivalent Resistance = "+R+" Ω"

}

else{

let sum=0

components.forEach(v=>sum+=1/v)

let R=1/sum

document.getElementById("result").innerText=
"Equivalent Resistance = "+R.toFixed(3)+" Ω"

}

}

else{

document.getElementById("result").innerText=
"Capacitor system coming next..."

}

}

</script>

</body>
</html>
