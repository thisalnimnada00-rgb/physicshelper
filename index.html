<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Helper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .resistor-theme {
            background-color: #f0f0f0;
            background-image: url('resistor-pattern.png');
        }
        .capacitor-theme {
            background-color: #e0f7fa;
            background-image: url('capacitor-pattern.png');
        }
    </style>
</head>
<body>
    <header>
        <h1>Physics Helper</h1>
        <label for="systemType">Select System Type:</label>
        <select id="systemType" onchange="changeTheme()">
            <option value="resistors">Resistors</option>
            <option value="capacitors">Capacitors</option>
        </select>
    </header>
    <main>
        <div id="drawingArea">
            <!-- Drawing area for resistors or capacitors -->
        </div>
        <div id="inputResistors" style="display:none;">
            <h2>Resistor System</h2>
            <input type="text" id="resistorValues" placeholder="Enter resistances (r1,r2,r3)">
            <button onclick="calculateResistance()">Calculate Equivalent Resistance</button>
        </div>
        <div id="inputCapacitors" style="display:none;">
            <h2>Capacitor System</h2>
            <input type="text" id="capacitorValues" placeholder="Enter capacities (c1,c2,c3)">
            <button onclick="calculateCapacitance()">Calculate Equivalent Capacitance</button>
        </div>
    </main>
    <script>
        function changeTheme() {
            const systemType = document.getElementById('systemType').value;
            document.body.className = systemType === 'resistors' ? 'resistor-theme' : 'capacitor-theme';
            document.getElementById('inputResistors').style.display = systemType === 'resistors' ? 'block' : 'none';
            document.getElementById('inputCapacitors').style.display = systemType === 'capacitors' ? 'block' : 'none';
        }

        function calculateResistance() {
            const values = document.getElementById('resistorValues').value.split(',').map(Number);
            const seriesResistance = values.reduce((a, b) => a + b, 0);
            const parallelResistance = 1 / values.reduce((a, b) => a + (1 / b), 0);
            alert(`Series Resistance: ${seriesResistance} Ω\nParallel Resistance: ${parallelResistance} Ω`);
        }

        function calculateCapacitance() {
            const values = document.getElementById('capacitorValues').value.split(',').map(Number);
            const seriesCapacitance = 1 / values.reduce((a, b) => a + (1 / b), 0);
            const parallelCapacitance = values.reduce((a, b) => a + b, 0);
            alert(`Series Capacitance: ${seriesCapacitance} F\nParallel Capacitance: ${parallelCapacitance} F`);
        }
    </script>
</body>
</html>
