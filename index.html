<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Physics Circuit Solver</title>

<style>
body{
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff9a00,#ff3d00);
color:white;
}

h1{
margin-top:20px;
}

#toolbar{
margin:20px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

<select id="systemSelector" onchange="changeSystem()">
<option value="resistor">Resistor System</option>
<option value="capacitor">Capacitor System</option>
</select>

<select id="dimensionSelector">
<option value="2d">2D System</option>
<option value="3d">3D System</option>
</select>
  canvas{
background:white;
border:3px solid black;
}

input{
padding:8px;
margin:5px;
}

#result{
font-size:20px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>⚡ Physics Circuit Solver</h1>

<div id="toolbar">

<select id="systemType">
<option value="resistor">Resistors</option>
<option value="capacitor">Capacitors</option>
</select>

<select id="connectionType">
<option value="series">Series</option>
<option value="parallel">Parallel</option>
</select>

<button onclick="addComponent()">Add Component</button>
<button onclick="calculate()">Calculate Equivalent</button>

</div>

<canvas id="circuitCanvas" width="800" height="400"></canvas>

<div id="values"></div>

<div id="result"></div>

<script>
  let systemType="resistor"

function changeSystem(){

systemType=document.getElementById("systemSelector").value

if(systemType==="resistor"){
document.body.style.background="linear-gradient(135deg,#ff9a00,#ff3d00)"
}

if(systemType==="capacitor"){
document.body.style.background="linear-gradient(135deg,#00bfff,#0040ff)"
}

drawCircuit()

}

let components=[]
let canvas=document.getElementById("circuitCanvas")
let ctx=canvas.getContext("2d")

function drawComponent(x,y){

if(systemType==="resistor"){
drawResistor(x,y)
}
else{
drawCapacitor(x,y)
}

}

function drawCapacitor(x,y){

ctx.beginPath()

ctx.moveTo(x,y-20)
ctx.lineTo(x,y+20)

ctx.moveTo(x+20,y-20)
ctx.lineTo(x+20,y+20)

ctx.stroke()

}
}

function drawCircuit(){

ctx.clearRect(0,0,canvas.width,canvas.height)

let x=50
let y=200

for(let i=0;i<components.length;i++){

drawResistor(x,y)

ctx.fillStyle="black"
ctx.fillText(components[i]+"Ω",x+10,y-20)

x+=120

}

}

function drawComponent(x,y){

ctx.beginPath()

ctx.moveTo(x,y)

ctx.lineTo(x+10,y)

ctx.lineTo(x+20,y-10)

ctx.lineTo(x+30,y+10)

ctx.lineTo(x+40,y-10)

ctx.lineTo(x+50,y+10)

ctx.lineTo(x+60,y)

ctx.lineTo(x+70,y)

ctx.stroke()

}

function displayInputs(){

let html=""

for(let i=0;i<components.length;i++){

html+=`
<input type="number" value="${components[i]}" 
onchange="components[${i}]=Number(this.value)">
`

}

document.getElementById("values").innerHTML=html

}

function calculate(){

let type=document.getElementById("connectionType").value

if(components.length===0){
alert("Add components first")
return
}

if(systemType==="resistor"){

if(type==="series"){

let R=0
components.forEach(v=>R+=v)

document.getElementById("result").innerText=
"Equivalent Resistance = "+R+" Ω"

}

else{

let sum=0
components.forEach(v=>sum+=1/v)

let R=1/sum

document.getElementById("result").innerText=
"Equivalent Resistance = "+R.toFixed(3)+" Ω"

}

}

else if(systemType==="capacitor"){

if(type==="parallel"){

let C=0
components.forEach(v=>C+=v)

document.getElementById("result").innerText=
"Equivalent Capacitance = "+C+" F"

}

else{

let sum=0
components.forEach(v=>sum+=1/v)

let C=1/sum

document.getElementById("result").innerText=
"Equivalent Capacitance = "+C.toFixed(6)+" F"

}

}

}

</script>

</body>
</html>
